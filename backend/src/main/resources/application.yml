spring:
  application:
    name: honeyshare-backend

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/honeyshare?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USER:honeyshare}
    password: ${DB_PASSWORD:changeme}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  security:
    # Disable Spring Security's default user; we handle auth ourselves
    user:
      name: disabled
      password: disabled

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: strict
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        # Only expose health publicly; metrics behind a separate port/filter
        include: health,info,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      show-components: when-authorized
  server:
    port: ${MANAGEMENT_PORT:8081}

logging:
  level:
    root: INFO
    com.honeyshare: INFO
    # Never set to DEBUG in production — may log sensitive data
    org.springframework.security: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] [%X{correlationId}] [%X{transferId}] %-5level %logger{36} - %msg%n"

# ===== Application-specific configuration =====
honeyshare:
  storage:
    provider: ${STORAGE_PROVIDER:minio}
    endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
    region: ${STORAGE_REGION:us-east-1}
    bucket: ${STORAGE_BUCKET:honeyshare-files}
    access-key: ${STORAGE_ACCESS_KEY:minioadmin}
    secret-key: ${STORAGE_SECRET_KEY:minioadmin}
    presigned-url-lifetime-seconds: ${PRESIGNED_URL_LIFETIME_SECONDS:300}
    multipart-upload-lifetime-hours: ${MULTIPART_UPLOAD_LIFETIME_HOURS:48}

  upload:
    chunk-size-bytes: ${UPLOAD_CHUNK_SIZE_BYTES:10485760}   # 10 MB default
    max-concurrent-parts: ${UPLOAD_MAX_CONCURRENT_PARTS:4}
    max-file-size-bytes: ${MAX_FILE_SIZE_BYTES:107374182400}  # 100 GB target

  quota:
    default-user-bytes: ${QUOTA_DEFAULT_USER_BYTES:214748364800}  # 200 GB

  retention:
    default-duration-hours: ${RETENTION_DEFAULT_HOURS:24}
    max-duration-hours: ${RETENTION_MAX_HOURS:168}        # 7 days
    active-download-grace-hours: ${ACTIVE_DOWNLOAD_GRACE_HOURS:24}

  auth:
    session-duration-minutes: ${SESSION_DURATION_MINUTES:1440}   # 24 h
    invitation-expiry-hours: ${INVITATION_EXPIRY_HOURS:72}
    email-verification-expiry-hours: ${EMAIL_VERIFICATION_EXPIRY_HOURS:24}
    password-reset-expiry-minutes: ${PASSWORD_RESET_EXPIRY_MINUTES:60}
    max-login-attempts: ${MAX_LOGIN_ATTEMPTS:5}
    max-mfa-attempts: ${MAX_MFA_ATTEMPTS:5}
    argon2:
      memory-kibibytes: ${ARGON2_MEMORY_KIB:65536}
      iterations: ${ARGON2_ITERATIONS:3}
      parallelism: ${ARGON2_PARALLELISM:1}
      hash-length: ${ARGON2_HASH_LENGTH:32}
      salt-length: ${ARGON2_SALT_LENGTH:16}

  features:
    e2e-enabled: ${FEATURE_E2E_ENABLED:false}   # E2E not production-ready; key design under review

  notifications:
    email:
      provider: ${EMAIL_PROVIDER:local}  # Free local logger adapter by default ($0 cost)
    push:
      provider: ${PUSH_PROVIDER:local}    # Free local privacy-preserving adapter by default ($0 cost)

  app:
    base-url: ${APP_BASE_URL:http://localhost:8080}
    from-email: ${FROM_EMAIL:noreply@honeyshare.local}

